<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EAHS Agriculture Department Hub</title><style>:root{color-scheme:dark;--bg:#050b17;--surface:#0c1b30;--surface2:#10243d;--line:#1d3250;--gold:#ddbb52;--gold2:#f5dc8c;--blue:#316de5;--text:#f3f5fa;--muted:#bdcadb;--green:#45c7a2;--red:#ed8394}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6}a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid var(--gold2);outline-offset:4px}.hub-header{position:sticky;top:0;z-index:5;background:#09182cee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.hub-head{max-width:1280px;margin:auto;display:flex;gap:28px;align-items:center;padding:18px 28px}.hub-brand{display:flex;align-items:center;gap:13px;color:var(--text);white-space:nowrap}.hub-brand:hover{text-decoration:none}.hub-seal{display:grid;place-items:center;width:47px;height:47px;border:2px solid var(--gold);border-radius:12px;color:var(--gold);font:700 21px Georgia,serif}.hub-brand strong{font:700 20px Georgia,serif;letter-spacing:.02em}.hub-brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.hub-nav{display:flex;align-items:center;gap:20px;margin-left:auto;white-space:nowrap}.hub-nav a,.hub-nav button{font-size:13px;color:var(--text);background:none;border:0;padding:5px 0}.hub-nav button.active{color:var(--gold)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border:1px solid var(--gold);border-radius:10px;background:var(--gold);color:#07111f;font-weight:700;font-size:13px;line-height:1.4;text-decoration (--gold);font-weight:700}.tag{display:inline-block;font-size:10px;border:1px solid #395581;padding:2px 7px;border-radius:4px;color:#a7c7f7;background:#21406a55}.tag.gold{color:var(--gold2);border-color:#665b3b;background:#59442155}.tag.green{color:var(--green);border-color:#1b5d4c}.muted{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:50px 0 24px}.section-head h1,.section-head h2,.page-title{font:700 clamp(26px,3vw,36px)/1.2 Georgia,serif;margin:0 0 12px}.section-head p{margin:0;color:var(--muted);max-width:730px}.toolbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);padding:18px 22px;border-radius:14px;margin:26px 0}.toolbar input{max-width:420px}.empty{border:1px dashed #334966;border-radius:14px;padding:28px;color:var(--muted);background:#0a172844}.empty h3{color:var(--text);margin:0 0 8px}.empty p{margin:0 0 18px}label{display:grid;gap:6px;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #365080;border-radius:8px;background:#050e1d;color:var(--text);padding:10px 12px;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}textarea{resize:vertical}input[type=checkbox]{width:auto}input[type=date],input[type=time]{color-scheme:dark}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:9px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;text-transform:uppercase;font-family:monospace;color:var(--gold);font-size:11px;letter-spacing:.06em;background:#071221;padding:13px;white-space:nowrap}td{border-bottom:1px solid var(--line);padding:14px 13px;vertical-align:top}td small{display:block;color:var(--muted);margin-top:5px}.notice{border:1px solid #665b3b;padding:12px 16px;margin:0 0 20px;border-radius:10px;background:#59442133}.notice.error{border-color:#853b50;color:#ffc0cb}.status{color:var(--muted);font-size:12px}.hub-footer{max-width:1280px;margin:auto;padding:25px 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px}dialog{width:min(680px,calc(100vw - 30px));border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--text);max-height:90vh;box-shadow:0 24px 80px #0008}dialog::backdrop{background:#01040bd9}.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{font:700 24px Georgia,serif;margin:0}.close{background:none;color:var(--muted);border:0;font-size:27px}.modal-body{padding:24px;overflow:auto;max-height:calc(90vh - 75px)}.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.form-error{color:#ffb6c4;font-size:13px;white-space:pre-line}.subhead{font-size:20px;margin:24px 0 18px}.department-nav a{color:var(--gold)}@media(max-width:1050px){.hub-head{flex-wrap:wrap;gap:12px}.hub-nav{width:100%;margin-left:0;overflow:auto;gap:22px}.hub-head>.btn{margin-left:auto}.atom{opacity:.12}.cards{gap:14px}.card{padding:20px}}@media(max-width:760px){.hub-shell{padding:24px 18px 45px}.hub-head{padding:15px 18px}.hub-brand strong{font-size:17px}.hub-brand small{font-size:9px}.cards{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column;margin-top:35px}.hub-hero{padding:26px 0 36px}.hub-hero p{font-size:16px}.atom{right:0;width:200px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hub-footer{flex-direction:column}.toolbar input{max-width:100%}}

</style></head><body><header class="hub-header"><div class="hub-head"><a class="hub-brand" href="<?= appUrl ?>?page=hub" target="_top"><span class="hub-seal" aria-hidden="true">EA</span><span><strong>Everett Alvarez</strong><small>Agriculture Department</small></span></a><nav class="hub-nav" aria-label="Department navigation"><button data-hub-page="home" disabled>Home</button><a href="<?= appUrl ?>?page=reservations" target="_top">Ag Spaces</a><a href="<?= appUrl ?>" target="_top">Inventory</a><button data-hub-page="meetings" disabled>Minutes</button><button data-hub-page="updates" disabled>Updates</button><button data-hub-page="faculty" disabled>Faculty</button><button data-hub-page="links" disabled>Safety & Links</button></nav><a class="btn" href="<?= appUrl ?>?page=reservations" target="_top">Reserve a space</a></div></header><main class="hub-shell"><div id="notice"></div><div id="view"><section class="panel" role="status"><p class="eyebrow">Home of the Eagles</p><h1 class="page-title">Loading the department hub…</h1><p class="muted">Connecting to shared announcements, meeting records, and staff resources.</p></section></div></main><footer class="hub-footer"><span>Everett Alvarez High School · Agriculture Department</span><div class="row"><span id="mode">Connecting…</span><a id="hubRecords" href="<?= recordsUrl ?>" target="_blank" rel="noopener">Shared records ↗</a></div></footer><dialog id="modal"></dialog><script>window.EAHS_AG_CONFIG = <?!= bootstrapJSON ?>;window.EAHS_APP_URL = <?!= appUrlJSON ?>;window.EAHS_INITIAL_TAB = <?!= initialTabJSON ?>;

(function () {
  var inventoryUrl = window.EAHS_APP_URL + '?page=hub';
  var failed = false;
  var timer;
  window.__hubClientReady = false;
  document.getElementById('mode').textContent = 'SHARED DEPARTMENT HUB';
  function failure(message) {
    failed = true;
    clearTimeout(timer);
    var view = document.getElementById('view');
    view.textContent = '';
    var box = document.createElement('section'); box.className = 'panel'; box.setAttribute('role', 'alert');
    var heading = document.createElement('h1'); heading.textContent = 'Department hub could not load';
    var detail = document.createElement('p'); detail.textContent = message;
    var reload = document.createElement('a'); reload.className = 'btn'; reload.style.textDecoration = 'none'; reload.textContent = 'Reopen department hub'; reload.href = inventoryUrl; reload.target = '_top';
    var help = document.createElement('p'); help.className = 'muted'; help.textContent = 'Your department records remain saved. If this persists, send the complete error above.';
    box.appendChild(heading); box.appendChild(detail); box.appendChild(reload); box.appendChild(help); view.appendChild(box);
  }
  window.addEventListener('error', function (e) {
    failure((e.message || 'Page script failed.') + (e.lineno ? ' - line ' + e.lineno + ', column ' + (e.colno || 0) : '') + (e.filename ? ' - ' + e.filename : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    failure(e.reason && e.reason.message ? e.reason.message : String(e.reason || 'Startup request failed.'));
  });
  if (!(window.google && google.script && google.script.run)) {
    failure('Open the deployed department /exec link. This page connects through Google Apps Script.');
    return;
  }
  timer = setTimeout(function () {
    failure('Google has not returned the department interface after 45 seconds. Reopen the inventory or check the latest Apps Script execution.');
  }, 45000);
  google.script.run.withSuccessHandler(function (source) {
    clearTimeout(timer);
    if (typeof source !== 'string' || !source.trim()) { failure('The server returned no interface code. Add HubClient.html and deploy all three files together.'); return; }
    try {
      failed = false;
      var script = document.createElement('script');
      script.textContent = source + '\n//# sourceURL=EAHS-Department-Hub.js';
      document.body.appendChild(script);
      if (!window.__hubClientReady && !failed) failure('The department interface did not start. Confirm HubClient.html was copied completely, then deploy a new version.');
    } catch (e) { failure(e.message || String(e)); }
  }).withFailureHandler(function (e) { failure(e && e.message ? e.message : String(e)); }).getHubClient();
})();
