<header class="top"><div class="head"><div class="brand"><div class="mark">🌱</div><div><b>Everett Alvarez Agriculture</b><small>Department inventory · equipment and supplies</small></div></div><div class="row"><span class="hint" id="mode"></span><a class="btn gold" href="<?= appUrl ?>?page=hub" target="_top" style="text-decoration:none">Home</a></div></div></header>
<main class="shell"><nav class="tabs" id="tabs"></nav><div id="notice"></div><div id="view"><section class="panel" role="status"><h1>Loading shared inventory…</h1><p>Connecting to the department Google Sheet.</p></section></div></main><dialog id="modal"></dialog>
<script>window.EAHS_AG_CONFIG = <?!= bootstrapJSON ?>;window.EAHS_APP_URL = <?!= appUrlJSON ?>;
(function () {
  var inventoryUrl = window.EAHS_APP_URL;
  var failed = false;
  var timer;
  window.__inventoryClientReady = false;
  document.getElementById('mode').textContent = 'SHARED AGRICULTURE INVENTORY';
  function failure(message) {
    failed = true;
    clearTimeout(timer);
    var view = document.getElementById('view');
    view.textContent = '';
    var box = document.createElement('section'); box.className = 'panel'; box.setAttribute('role', 'alert');
    var heading = document.createElement('h1'); heading.textContent = 'Inventory could not load';
    var detail = document.createElement('p'); detail.textContent = message;
    var reload = document.createElement('a'); reload.className = 'btn'; reload.style.textDecoration = 'none'; reload.textContent = 'Reopen inventory'; reload.href = inventoryUrl; reload.target = '_top';
    var help = document.createElement('p'); help.className = 'muted'; help.textContent = 'Your inventory remains saved. If this persists, send the complete error above.';
    box.appendChild(heading); box.appendChild(detail); box.appendChild(reload); box.appendChild(help); view.appendChild(box);
  }
  window.addEventListener('error', function (e) {
    failure((e.message || 'Page script failed.') + (e.lineno ? ' - line ' + e.lineno + ', column ' + (e.colno || 0) : '') + (e.filename ? ' - ' + e.filename : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    failure(e.reason && e.reason.message ? e.reason.message : String(e.reason || 'Startup request failed.'));
  });
  if (!(window.google && google.script && google.script.run)) {
    failure('Open the deployed inventory /exec link. This page connects through Google Apps Script.');
    return;
  }
  timer = setTimeout(function () {
    failure('Google has not returned the inventory interface after 45 seconds. Reopen the inventory or check the latest Apps Script execution.');
  }, 45000);
  google.script.run.withSuccessHandler(function (source) {
    clearTimeout(timer);
    if (typeof source !== 'string' || !source.trim()) { failure('The server returned no interface code. Add InventoryClient.html and deploy all three files together.'); return; }
    try {
      failed = false;
      var script = document.createElement('script');
      script.textContent = source + '\n//# sourceURL=EAHS-Ag-Inventory-Client.js';
      document.body.appendChild(script);
      if (!window.__inventoryClientReady && !failed) failure('The inventory interface did not start. Confirm InventoryClient.html was copied completely, then deploy a new version.');
    } catch (e) { failure(e.message || String(e)); }
  }).withFailureHandler(function (e) { failure(e && e.message ? e.message : String(e)); }).getInventoryClient();
})();
</script>
